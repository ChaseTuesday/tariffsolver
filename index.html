<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TariffSolver is researching how importers plan for tariff costs. No services are currently offered.">
  <meta name="robots" content="noindex">
  <title>TariffSolver</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --line:#34435c; --ink:#f5f8ff; --muted:#c5d2e6; --aqua:#84e5dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:Arial,Helvetica,sans-serif; line-height:1.55; }
    .wrap { width:min(720px,calc(100% - 40px)); margin:auto; padding:90px 0; }
    .brand { font-size:1.25rem; font-weight:800; letter-spacing:-.035em; }
    .brand span { color:var(--aqua); }
    h1 { font-size:clamp(2rem,5vw,3rem); line-height:1.12; letter-spacing:-.04em; margin:40px 0 20px; }
    p { color:var(--muted); font-size:1.08rem; }
    a { color:var(--aqua); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">Tariff<span>Solver</span></div>
    <h1>We are pausing to do more research.</h1>
    <p>TariffSolver is studying how importers plan for tariff costs. We are not currently offering any services or accepting new customers.</p>
    <p>Questions or ideas? Write to <a href="mailto:hello@tariffsolver.com">hello@tariffsolver.com</a>.</p>
  </main>
</body>
</html>
